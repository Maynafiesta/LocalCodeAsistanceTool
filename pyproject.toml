[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codeassist-local"
version = "0.1.0"
description = "Offline, LAN-hosted coding assistant gateway for Continue and Ollama"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "pyyaml>=6,<7"]

[project.scripts]
codeassist-index = "codeassist.context:main"
codeassist-client = "codeassist.client:main"

[tool.setuptools.packages.find]
include = ["codeassist*"]

[tool.setuptools.package-data]
codeassist = ["*.template", "*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
